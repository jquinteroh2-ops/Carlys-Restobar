# PostgreSQL para desarrollo local.
#
# En Railway la base es un servicio gestionado y estas credenciales no existen:
# aquí son deliberadamente triviales porque el puerto solo escucha en localhost.
#
# Se publica en el 5435 y no en el 5432 porque muchas máquinas de desarrollo ya
# tienen un PostgreSQL propio instalado en el puerto estándar. Si el contenedor
# lo tomara también, el host resolvería contra la instalación local y el error
# que aparece es «autenticación fallida», que no dice nada sobre el conflicto.
#
# El 5433 y el 5434 los ocupan otros sistemas hechos con esta misma base, así
# que esta toma el siguiente libre: así se pueden levantar todos a la vez sin
# que uno le quite el puerto al otro.

# El nombre del proyecto, escrito y no deducido.
#
# Sin esta línea Docker lo saca del nombre de la carpeta, que en todos estos
# repositorios es `backend`: los compose se creían el mismo proyecto, y
# levantar la base de uno BORRABA el contenedor del otro. Los datos se salvaban
# de milagro, porque el volumen sí lleva nombre propio.
name: carlys

services:
  base:
    image: postgres:16-alpine
    container_name: carlys-base
    environment:
      POSTGRES_DB: carlys
      POSTGRES_USER: carlys
      POSTGRES_PASSWORD: carlys
    ports:
      - '5435:5432'
    volumes:
      - datos-carlys:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carlys -d carlys']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  datos-carlys:
