# Despliegue de DEMOSTRACIÓN en Render, en el plan gratuito.
#
# Dos piezas en Render: el backend (Docker) y el sitio (estático). La base es
# un Postgres de Neon (proyecto carlys-restobar, us-east-1), que no vence: la
# gratuita de Render venció a los 30 días y tumbó el backend. El guion de
# arranque traduce la cadena de Neon (postgresql://usuario:clave@servidor/base)
# al formato JDBC.
#
# Qué implica el plan gratuito:
#   - El backend se duerme tras 15 minutos sin visitas. La primera petición
#     después lo despierta y tarda cerca de un minuto; el sitio carga al
#     instante, pero la carta aparece cuando el backend termina de despertar.
#   - No hay disco persistente: fotos subidas, hojas de vida y adjuntos de PQR
#     se pierden en cada reinicio. Para una demostración da igual; para operar
#     de verdad, no.
#
# Está en MODO DEMOSTRACIÓN (CARLYS_CLAVE_DEMO): siete cuentas con clave
# conocida y datos de ejemplo. Esto NO es un despliegue para operar.

services:
  - type: web
    name: carlys-restobar-api
    runtime: docker
    plan: free
    # Virginia: la región más cercana a Colombia, y la misma de la base de
    # Neon (us-east-1). Base y backend lejos suman latencia a cada consulta.
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /salud
    autoDeploy: true
    envVars:
      # La cadena de Neon, tal como la entrega su panel. Lleva la clave, así
      # que no va en el repositorio: se pone a mano en el panel de Render.
      - key: DATABASE_URL
        sync: false
      - key: CARLYS_JWT_SECRETO
        generateValue: true
      - key: CARLYS_CORS_ORIGENES
        value: https://carlys-restobar.onrender.com
      - key: CARLYS_CLAVE_DEMO
        value: carlys2026
      - key: CARLYS_ZONA
        value: America/Bogota
      # 512 MB en el plan gratuito. El recolector serial y pilas más pequeñas
      # dejan a Spring holgura suficiente; con los valores de fábrica el
      # contenedor se acerca al límite y la plataforma lo reinicia.
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1

  - type: web
    name: carlys-restobar
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: VITE_URL_API
        value: https://carlys-restobar-api.onrender.com
    # Aplicación de una sola página: cualquier ruta (/carta, /reservar,
    # /admin...) sirve index.html y el enrutador de React decide qué mostrar.
    # Sin esto, recargar en /carta da 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # El service worker no puede quedarse en caché: si el navegador guarda el
      # viejo, los clientes siguen viendo la versión anterior del sitio.
      - path: /sw.js
        name: Cache-Control
        value: no-cache
